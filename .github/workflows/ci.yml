name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  # Weekly run so submodule/toolchain rot surfaces during dormant periods.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  build:
    name: GHC ${{ matrix.ghc }} / ${{ matrix.os }}${{ matrix.flags != '' && format(' ({0})', matrix.flags) || '' }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — all GHC versions, no asm
          - os: ubuntu-latest
            ghc: '9.6'
            flags: ''
          - os: ubuntu-latest
            ghc: '9.8'
            flags: ''
          - os: ubuntu-latest
            ghc: '9.10'
            flags: ''
          - os: ubuntu-latest
            ghc: '9.12'
            flags: ''
          # Linux — all GHC versions, with asm
          - os: ubuntu-latest
            ghc: '9.6'
            flags: '-fasm'
          - os: ubuntu-latest
            ghc: '9.8'
            flags: '-fasm'
          - os: ubuntu-latest
            ghc: '9.10'
            flags: '-fasm'
          - os: ubuntu-latest
            ghc: '9.12'
            flags: '-fasm'
          # macOS — all GHC versions, no asm
          - os: macos-latest
            ghc: '9.6'
            flags: ''
          - os: macos-latest
            ghc: '9.8'
            flags: ''
          - os: macos-latest
            ghc: '9.10'
            flags: ''
          - os: macos-latest
            ghc: '9.12'
            flags: ''
          # macOS — all GHC versions, with asm
          - os: macos-latest
            ghc: '9.6'
            flags: '-fasm'
          - os: macos-latest
            ghc: '9.8'
            flags: '-fasm'
          - os: macos-latest
            ghc: '9.10'
            flags: '-fasm'
          - os: macos-latest
            ghc: '9.12'
            flags: '-fasm'
          # Windows — single GHC version, no asm
          # TODO: Windows builds but the test binary crashes instantly at
          # runtime (exit code 1, no test output). Needs debugging — likely
          # a Haskell exception during initialization. The build itself
          # succeeds after fixing the wincrypt.h X509_NAME clash
          # (WIN32_LEAN_AND_MEAN) and linking advapi32/bcrypt/ws2_32.
          # Until that is fixed, the job is experimental (continue-on-error)
          # so it cannot turn the whole workflow red.
          - os: windows-latest
            ghc: '9.6'
            flags: ''
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up GHC ${{ matrix.ghc }}
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: ~/.cabal/store
          key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ matrix.flags }}-${{ hashFiles('boringssl.cabal') }}
          restore-keys: |
            ${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ matrix.flags }}-
            ${{ runner.os }}-ghc-${{ matrix.ghc }}-

      - name: Configure
        run: cabal configure --enable-tests --enable-benchmarks ${{ matrix.flags }}

      - name: Build dependencies
        run: cabal build --only-dependencies

      - name: Build
        run: cabal build

      - name: Run tests
        run: cabal test --test-show-details=direct

      # Bisect the Windows test-binary crash (builds fine, exits 1 instantly
      # with no output). Each probe narrows where startup dies:
      #   hello       -> GHC RTS / toolchain sanity
      #   --help      -> tasty startup, no tests executed, no crypto FFI
      #   -p nomatch  -> full test-tree construction, zero tests run
      #   -p Base64   -> smallest real FFI slice into BoringSSL
      - name: Windows crash diagnostics
        if: runner.os == 'Windows' && always()
        shell: pwsh
        continue-on-error: true
        run: |
          'main = putStrLn "rts-ok"' | Out-File -Encoding ascii Hello.hs
          ghc -threaded Hello.hs -o hello-probe.exe
          ./hello-probe.exe
          Write-Host "hello exit: $LASTEXITCODE"
          $exe = Get-ChildItem -Recurse dist-newstyle -Filter 'boringssl-test.exe' |
            Select-Object -First 1 -ExpandProperty FullName
          Write-Host "test binary: $exe"
          & $exe --help 2>&1 | Out-Host
          Write-Host "--help exit: $LASTEXITCODE"
          & $exe -p 'zzz-no-such-test' 2>&1 | Out-Host
          Write-Host "tree-only exit: $LASTEXITCODE"
          & $exe -p 'Base64' 2>&1 | Out-Host
          Write-Host "base64 exit: $LASTEXITCODE"

      - name: Check documentation
        run: cabal haddock
